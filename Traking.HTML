<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Tracking — CHAMNAN FOOD</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="responsive.css">
</head>
<body>

  <header class="header">
    <div class="container header-container">
      <a href="iNDEX.html" class="brand-logo">🍔 CHAMNAN <span>FOOD</span></a>
      <a href="menu.html" class="btn btn-outline" style="padding: 8px 16px;">ត្រឡប់ទៅ Menu</a>
    </div>
  </header>

  <div class="container" style="max-width: 800px; padding: 40px 20px;">
    <div class="section-title">
      <h2>តាមដានស្ថានភាពការកម្មង់</h2>
      <p>សូមបញ្ចូលលេខកូដសម្គាល់ការកម្មង់របស់អ្នក (Order ID)</p>
    </div>

    <div class="search-wrapper" style="display:flex; gap:10px;">
      <input type="text" id="track-search-input" class="search-input" placeholder="ស្វែងរក" style="padding-left:20px;">
      <button id="track-search-btn" class="btn btn-primary" style="border-radius: var(--radius-full); padding: 0 30px;">ស្វែងរក</button>
    </div>

    <!-- Tracking Progress & Dynamic Card -->
    <div id="tracking-result"></div>
  </div>

  <script src="Main.js"></script>
  <script src="Tracking.js"></script>
</body>
</html>
