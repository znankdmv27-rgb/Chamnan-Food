<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — CHAMNAN FOOD</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="amin.CSS">
</head>
<body class="admin-body">

  <aside class="admin-sidebar">
    <div class="admin-sidebar-header">CHAMNAN ADMIN</div>
    <ul class="admin-nav">
      <li><a href="Dashboak.HTML">📊 Dashboard</a></li>
      <li><a href="orders.html">📦 Orders</a></li>
      <li><a href="products.html">🍔 Products</a></li>
      <li><a href="costom.html">👥 Customers</a></li>
      <li><a href="settings.html" class="active">⚙️ Settings</a></li>
      <li><a href="iNDEX.html">🚪 Logout</a></li>
    </ul>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <h1>ការកំណត់ទូទៅ (Settings)</h1>
    </div>

    <div class="admin-table-container" style="max-width: 600px;">
      <form onsubmit="event.preventDefault(); showToast('✅ ការកំណត់ត្រូវបានរក្សាទុក!');">
        <div style="margin-bottom: 16px;">
          <label style="display:block; margin-bottom: 6px; font-weight:600;">ឈ្មោះហាង (Store Name)</label>
          <input type="text" value="CHAMNAN FOOD" style="width:100%; padding:10px; border:1px solid var(--border); border-radius:4px;">
        </div>
        <div style="margin-bottom: 16px;">
          <label style="display:block; margin-bottom: 6px; font-weight:600;">ថ្លៃដឹកជញ្ជូនគោល (Default Delivery Fee $)</label>
          <input type="number" step="0.5" value="0" style="width:100%; padding:10px; border:1px solid var(--border); border-radius:4px;">
        </div>
        <div style="margin-bottom: 16px;">
          <label style="display:block; margin-bottom: 6px; font-weight:600;">លេខទូរស័ព្ទទំនាក់ទំនង (Store Phone)</label>
          <input type="text" value="093318655" style="width:100%; padding:10px; border:1px solid var(--border); border-radius:4px;">
        </div>
        <button type="submit" class="btn btn-primary" style="border-radius: var(--radius-sm);">Save Settings</button>
      </form>
    </div>
  </main>

  <script src="Main.js"></script>
  <script src="amin.js"></script>
</body>
</html>
